    sampling_unit: matched_training_seed
    master_seed: 0
    statistic: mean_paired_difference
    resampling: with_replacement
  multiplicity_control:
    method: Bonferroni
    family_wise_alpha: 0.05
    comparison_count: 2
    one_sided_alpha_per_challenger: 0.025
    lower_bound_percentile: 2.5
  descriptive_ci95:
    lower_percentile: 2.5
    upper_percentile: 97.5
    final_gate_use: forbidden
  stable_positive_gain:
    mean_delta_strictly_greater_than_zero: true
    bonferroni_lower_bound_strictly_greater_than_zero: true
  practical_gain:
    requires_stable_positive_gain: true
    minimum_mean_delta: 0.003
  new_stable_best_selection:
    - qualification_level_practical_before_small_stable
    - stage2_mean_delta_descending
    - joint_fingerprint_lexicographic_ascending_within_1e-12_tie

