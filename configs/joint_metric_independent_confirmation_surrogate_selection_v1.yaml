    unit: pool
    alternative: one_sided
    role: descriptive_only

metric_family_confirmation:
  methods: [M1, M2]
  comparator: frozen_B_STAR
  individually_confirmed_requires_all: [C1, C2, C3, C4, C5, C6]
  C1:
    disagreement_pools_at_least: 6
  C2:
    wins_fraction_formula: ceil_two_thirds_times_disagreement
    wins_at_least: 4
  C3:
    mean_selected_validation_advantage_all_16_at_least: 0.003
  C4:
    mean_simple_regret_at_most_comparator_fraction: 0.80
    comparator_near_zero_threshold_strictly_less_than: 1.0e-6
    near_zero_fallback: method_regret_less_than_or_equal_to_comparator
  C5:
    true_best_hits_at_least_comparator: true
  C6:
    bootstrap_selected_validation_difference_ci95_lower_strictly_greater_than: 0.0
  family_confirmed_rule: confirmed_M1_OR_confirmed_M2
  neither_confirmed_action: METRIC_FAMILY_NOT_CONFIRMED
  random_may_confirm_family: false
  previous_pilot_pools_enter_gate: false

surrogate_selection:
  execute_only_if_metric_family_confirmed: true
  comparison: M1_vs_M2_on_current_16_pools_only
  GP_increment:
    requires_all: [S_GP_1, S_GP_2, S_GP_3, S_GP_4, S_GP_5]
    S_GP_1: {disagreement_pools_at_least: 6}
    S_GP_2:
      M2_wins_fraction_formula: ceil_two_thirds_times_disagreement
      M2_wins_at_least: 4
    S_GP_3:
      M2_mean_regret_at_most_M1_fraction: 0.90
      M1_near_zero_threshold_strictly_less_than: 1.0e-6
      near_zero_fallback: M2_regret_less_than_or_equal_to_M1
    S_GP_4: {M2_true_best_hits_at_least_M1: true}
    S_GP_5: {bootstrap_M2_minus_M1_ci95_lower_strictly_greater_than: 0.0}
    final_surrogate: M2
    classification: METRIC_FAMILY_CONFIRMED_GP_SELECTED
    selection_basis: CLEAR_GP_INCREMENT
  KNN_advantage:
    evaluate_only_if_GP_increment_fails: true
    requires_all: [S_KNN_1, S_KNN_2, S_KNN_3, S_KNN_4, S_KNN_5]
    S_KNN_1: {disagreement_pools_at_least: 6}
    S_KNN_2:
      M1_wins_fraction_formula: ceil_two_thirds_times_disagreement
      M1_wins_at_least: 4
    S_KNN_3:
      M1_mean_regret_at_most_M2_fraction: 0.90
      M2_near_zero_threshold_strictly_less_than: 1.0e-6
      near_zero_fallback: M1_regret_less_than_or_equal_to_M2
    S_KNN_4: {M1_true_best_hits_at_least_M2: true}
    S_KNN_5: {bootstrap_M1_minus_M2_ci95_lower_strictly_greater_than: 0.0}
    final_surrogate: M1
    classification: METRIC_FAMILY_CONFIRMED_KNN_SELECTED
    selection_basis: CLEAR_KNN_ADVANTAGE
  parsimony:
    condition: family_confirmed_and_no_clear_GP_or_KNN_advantage
    final_surrogate: M1
    classification: METRIC_FAMILY_CONFIRMED_KNN_SELECTED
    selection_basis: PARSIMONY_NO_CLEAR_GP_INCREMENT
    interpretation: no_evidence_that_GP_complexity_is_necessary_not_proof_that_M1_is_superior

